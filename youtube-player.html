<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YouTube background player</title>
    <style>
      * { box-sizing: border-box; }
      html, body, #player { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #000; }
      #player { position: fixed; inset: 0; pointer-events: none; }
      #player.cover {
        top: 50%;
        left: 50%;
        width: 100vw;
        height: 56.25vw;
        min-width: 177.78vh;
        min-height: 100vh;
        transform: translate(-50%, -50%);
      }
      iframe { width: 100%; height: 100%; border: 0; pointer-events: none; }
      .message { height: 100%; display: grid; place-items: center; padding: 24px; color: #ddd; font: 16px system-ui; text-align: center; }
    </style>
  </head>
  <body>
    <div id="player"></div>
    <script src="youtube-player.js"></script>
  </body>
</html>
